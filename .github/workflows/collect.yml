name: collect

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort and WILL drift under
    # load, sometimes by 20+ minutes. That is fine: every row is stamped at the
    # moment of collection, not at the scheduled time, so drift shows up as
    # uneven sampling rather than wrong timestamps.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Never let a delayed run overlap the next one - two jobs pushing to the same
# branch is the only way this breaks.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poll Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python3 collect.py

      - name: Commit data
        run: |
          git config user.name  "stream-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --quiet --cached && echo "nothing to commit" && exit 0
          git commit -m "data: $(date -u +%FT%TZ) [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1
